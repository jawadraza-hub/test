<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmaCare | Pharmacy Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark"></span><div><b id="brand-name">PharmaCare</b><small>Pharmacy Management</small></div></div>
    <nav class="nav" id="nav">
      <a href="#dashboard" data-v="dashboard">Dashboard</a>
      <a href="#pos" data-v="pos">Point of Sale</a>
      <a href="#inventory" data-v="inventory">Inventory <i id="badge" class="badge" hidden></i></a>
      <a href="#sales" data-v="sales">Sales History</a>
      <a href="#settings" data-v="settings">Settings</a>
    </nav>
    <div class="side-foot">Data is stored securely in this browser. Export a backup regularly from Settings.</div>
  </aside>
  <div class="content">
    <header class="top">
      <div><h1 id="title">Dashboard</h1><p id="date" class="muted"></p></div>
      <button class="btn ghost" data-a="theme" aria-label="Toggle theme">Theme</button>
    </header>
    <main id="view"></main>
  </div>
</div>
<dialog id="modal"></dialog>
<div id="toast" class="toast" role="status"></div>
<script src="js/app.js"></script>
</body>
</html>
